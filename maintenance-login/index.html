<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DcWolfPlayz | Admin Login Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background-color: #0b0b0e;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .admin-login-container {
            background: #12131a;
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 16px;
            padding: 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.15);
            text-align: center;
        }
        .admin-login-container h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: #8b5cf6;
            margin-bottom: 25px;
            text-transform: uppercase;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #8e8ea0;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 15px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }
        .btn-admin-login {
            width: 100%;
            background: #8b5cf6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            margin-top: 10px;
        }
        .btn-admin-login:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }
        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #8e8ea0;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .back-home:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="admin-login-container">
        <div style="font-size: 2.5rem; color: #8b5cf6; margin-bottom: 15px;">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2>Admin Dashboard Login</h2>
        <form onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>Admin Username or Email</label>
                <input type="text" id="adminUser" placeholder="Enter admin username" required>
            </div>
            <div class="form-group">
                <label>Secure Admin Password</label>
                <input type="password" id="adminPass" placeholder="••••••••••••" required>
            </div>
            <button type="submit" class="btn-admin-login">LOGIN TO DASHBOARD</button>
        </form>
        <a href="/" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();

            // Aap yaha apna admin check laga sakte hain (Default test admin check)
            if (username === "admin" && pass === "admin123") {
                const adminData = { username: username, role: "admin" };
                localStorage.setItem('dcwolf_current_user', JSON.stringify(adminData));
                
                alert("Admin Authentication Successful! Redirecting to Control Center...");
                window.location.href = "/admin"; // Aapke admin panel ka page link
            } else {
                // Agar localStorage mein koi registered admin user ho toh usse verify karein
                let registeredUsers = JSON.parse(localStorage.getItem('dcwolf_users')) || [];
                let foundAdmin = registeredUsers.find(u => u.username === username && u.role === 'admin');

                if (foundAdmin) {
                    localStorage.setItem('dcwolf_current_user', JSON.stringify(foundAdmin));
                    alert("Welcome back Admin!");
                    window.location.href = "/admin";
                } else {
                    alert("Invalid Admin Credentials! Access Denied.");
                }
            }
        }
    </script>
</body>
</html>
