<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DcWolfPlayz - Under Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #0b0b0e;
            --bg-card: #12131a;
            --accent-green: #00ff66;
            --accent-orange: #fb923c;
            --text-main: #ffffff;
            --text-muted: #8e8ea0;
            --border-dark: rgba(255, 255, 255, 0.08);
            --font-pixel: 'Press Start 2P', cursive, monospace;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .maintenance-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dark);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .eta-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(251, 146, 60, 0.1);
            color: var(--accent-orange);
            border: 1px solid rgba(251, 146, 60, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-box {
            font-size: 3rem;
            color: var(--accent-orange);
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-family: var(--font-pixel);
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 15px;
            text-transform: uppercase;
            line-height: 1.5;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #5865F2;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
            margin-bottom: 20px;
        }

        .btn-discord:hover {
            background: #4752C4;
            transform: translateY(-2px);
        }

        .admin-login-link {
            display: block;
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.3s;
        }

        .admin-login-link:hover {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <!-- Right Side ETA Badge -->
        <div class="eta-badge">
            <i class="fa-solid fa-clock"></i> ETA: ~2 Hours
        </div>

        <div class="icon-box">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>

        <h1>Under Maintenance</h1>
        <p>DcWolfPlayz website is currently undergoing infrastructure upgrades and adding new custom Minecraft features. Stay tuned!</p>

        <!-- Only Discord Button -->
        <a href="https://discord.gg/dcwolfplayz" target="_blank" class="btn-discord">
            <i class="fa-brands fa-discord"></i> Join Official Discord
        </a>

        <!-- Admin Login Button -->
        <div>
            <a href="/login" class="admin-login-link">
                <i class="fa-solid fa-lock"></i> Admin Portal Login
            </a>
        </div>
    </div>

</body>
</html>
