<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DcWolfPlayz | Authentication</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- NAVBAR -->
    <header>
        <a href="/" class="brand" style="font-weight: 900; font-size: 1.3rem;">
            <div class="brand-logo" style="background: transparent !important; box-shadow: none !important; border: none !important; display: flex; align-items: center; justify-content: center; width: auto; height: auto;">
                <img src="/images/head.png" alt="Logo" style="width: 48px; height: 48px; object-fit: contain;">
            </div>
            DCWOLF  PLAYZ
        </a>
        <nav>
            <a href="/" class="nav-btn">Home</a>
            <a href="/rules" class="nav-btn">Rules</a>
            <a href="/suggestions" class="nav-btn">Suggestions</a>
            <a href="/community" class="nav-btn">Community</a>
            <a href="/helpdesk" class="nav-btn">Help Desk</a>
        </nav>
        <div class="nav-right-actions">
            <a href="/login" class="auth-nav-btn" id="loginNavBtn" style="text-decoration:none; display:inline-block; text-align:center;">LOGIN / REGISTER</a>
            <a href="/admin" class="auth-nav-btn" id="adminNavBtn" style="display:none; background: var(--accent-purple); color: #fff; text-decoration:none; text-align:center;">ADMIN DASHBOARD</a>
        </div>
    </header>

    <!-- LOGIN / REGISTER CARD SECTION -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 50px 20px;">
        <div style="background: #161824; border: 1px solid var(--border-dark); border-radius: 18px; max-width: 440px; width: 100%; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            
            <h2 id="pageAuthTitle" style="font-size: 1.1rem; color: var(--accent-green); text-align: center; margin-bottom: 24px;">
                USER LOGIN
            </h2>

            <!-- ERROR ALERT BOX -->
            <div class="form-error-alert" id="authErrorAlert" style="display: none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="authErrorAlertText">Invalid Username or Password!</span>
            </div>

            <!-- DISCORD DIRECT LOGIN BUTTON -->
            <button type="button" class="btn-discord" onclick="loginWithDiscord()">
                <i class="fa-brands fa-discord" style="font-size: 1.1rem;"></i> CONTINUE WITH DISCORD
            </button>

            <!-- OR DIVIDER -->
            <div style="display: flex; align-items: center; margin: 22px 0; color: var(--text-muted); font-size: 0.75rem;">
                <div style="flex: 1; height: 1px; background: var(--border-dark);"></div>
                <span style="padding: 0 12px; font-weight: 600;">OR WITH EMAIL & PASSWORD</span>
                <div style="flex: 1; height: 1px; background: var(--border-dark);"></div>
            </div>

            <!-- EMAIL / USERNAME / PASSWORD FORM -->
            <form onsubmit="handleAuthSubmit(event)">
                <div class="form-group" id="emailGroup" style="display: none;">
                    <label>Email Address</label>
                    <input type="email" id="authEmail" placeholder="e.g. user@example.com">
                </div>
                
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="authUsername" required placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" required placeholder="Enter password">
                </div>

                <button type="submit" class="btn-green" style="width: 100%; justify-content: center; margin-top: 10px;">
                    SUBMIT
                </button>
            </form>

            <!-- TOGGLE REGISTER / LOGIN LINK -->
            <p style="text-align: center; font-size: 0.88rem; color: var(--text-muted); margin-top: 22px;">
                <span id="authToggleText">Don't have an account?</span> 
                <a href="#" onclick="toggleAuthPageMode(event)" style="color: var(--accent-green); font-weight: 700; text-decoration: underline;" id="authToggleLink">Register here</a>
            </p>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 DcWolfPlayz Official Hub. All Rights Reserved.</p>
    </footer>

    <!-- SUCCESS NOTIFICATION MODAL -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-body" style="max-width: 420px; text-align: center;">
            <i class="fa-solid fa-circle-check" style="font-size: 2.8rem; color: var(--accent-green); margin-bottom: 15px;"></i>
            <h3 style="font-size: 1rem; color: #fff; margin-bottom: 10px;" id="alertModalTitle">SUCCESS</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 22px;" id="alertModalText">Action completed successfully.</p>
            <button onclick="closeAlertModal()" class="btn-green" style="width:100%; justify-content:center;">OKAY</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script src="/js/skript.js"></script>
    <script>
        let isPageRegisterMode = false;

        function toggleAuthPageMode(e) {
            e.preventDefault();
            hideFormError();
            isPageRegisterMode = !isPageRegisterMode;
            isRegisterMode = isPageRegisterMode; // Update global state in skript.js

            document.getElementById('pageAuthTitle').innerText = isPageRegisterMode ? "REGISTER NEW ACCOUNT" : "USER LOGIN";
            document.getElementById('emailGroup').style.display = isPageRegisterMode ? "block" : "none";
            document.getElementById('authToggleText').innerText = isPageRegisterMode ? "Already have an account?" : "Don't have an account?";
            document.getElementById('authToggleLink').innerText = isPageRegisterMode ? "Login here" : "Register here";
        }
    </script>
</body>
</html>
